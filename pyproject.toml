[project]
name = "valet"
version = "0.1.0"
description = "Valet — a Jeeves-style personal memory agent (Mem0 + SQLite)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mem0ai>=2.0",
    "chromadb>=1.5",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
